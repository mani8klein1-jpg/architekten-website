<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin-Bereich - Architekt</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="image/logo.png" alt="Architekt Logo">
        </div>

        <button class="hamburger" id="hamburger" aria-label="Menü öffnen">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-menu" id="navMenu">
            <a href="index.html">STARTSEITE</a>
            <a href="projekte.html">PROJEKTE</a>
            <a href="team.html">ÜBER UNS</a>
            <a href="foerderung.html">FÖRDERUNG</a>
            <a href="kontakt.html">KONTAKT</a>
        </nav>

    </header>

    <!-- LOGIN -->
    <section class="admin-login" id="loginSection">
        <div class="login-box">
            <h1>Admin-Login</h1>
            <p>Bitte melden Sie sich an, um Förderungen zu verwalten.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input type="password" id="password" required>
                </div>

                <button type="submit" class="btn-primary">Anmelden</button>
            </form>

            <p class="error" id="loginError" style="display:none;"></p>
        </div>
    </section>

    <!-- ADMIN-BEREICH -->
    <section class="admin-panel" id="adminSection" style="display:none;">

        <div class="admin-container">

            <div class="admin-header">
                <h1>Förderungen verwalten</h1>
                <button class="btn-logout" id="logoutBtn">Abmelden</button>
            </div>

            <button class="btn-primary" id="newFoerderungBtn">+ Neue Förderung</button>

            <!-- TABELLE -->
            <div class="table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Maßnahme</th>
                            <th>Gebäudetyp</th>
                            <th>Zuschuss</th>
                            <th>Max. Förderung</th>
                            <th>Aktionen</th>
                        </tr>
                    </thead>
                    <tbody id="foerderungenTable">
                        <!-- Wird per JavaScript gefüllt -->
                    </tbody>
                </table>
            </div>

        </div>

    </section>

    <!-- FORMULAR-MODAL -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal-box">
            <span class="modal-close" id="modalClose">&times;</span>

            <h2 id="modalTitle">Neue Förderung</h2>

            <form id="foerderungForm">
                <input type="hidden" id="foerderungId">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="massnahme">Maßnahme</label>
                    <select id="massnahme" required>
                        <option value="">-- Bitte wählen --</option>
                        <option value="dach">Dach</option>
                        <option value="heizung">Heizung</option>
                        <option value="fenster">Fenster</option>
                        <option value="gebaeudehuelle">Gebäudehülle</option>
                        <option value="neubau">Neubau</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gebaeudetyp">Gebäudetyp</label>
                    <select id="gebaeudetyp" required>
                        <option value="">-- Bitte wählen --</option>
                        <option value="einfamilienhaus">Einfamilienhaus</option>
                        <option value="mehrfamilienhaus">Mehrfamilienhaus</option>
                        <option value="gewerbe">Gewerbe</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="zuschuss">Zuschuss</label>
                    <input type="text" id="zuschuss" required>
                </div>

                <div class="form-group">
                    <label for="details">Details</label>
                    <textarea id="details" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="max_foerderung">Max. Förderung (€)</label>
                    <input type="number" id="max_foerderung" step="0.01">
                </div>

                <button type="submit" class="btn-primary">Speichern</button>
            </form>
        </div>
    </div>

    <footer>
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
    </footer>

    <script src="script.js"></script>
    <script src="admin.js"></script>

</body>
</html>
