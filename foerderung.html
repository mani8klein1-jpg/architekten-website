<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Förderungs-Check - Architekt</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="foerderung.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="image/logo.png" alt="Architekt Logo">
        </div>

        <button class="hamburger" id="hamburger" aria-label="Menü öffnen">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-menu" id="navMenu">
            <a href="index.html">STARTSEITE</a>
            <a href="projekte.html">PROJEKTE</a>
            <a href="team.html">ÜBER UNS</a>
            <a href="foerderung.html" class="active">FÖRDERUNG</a>
            <a href="kontakt.html">KONTAKT</a>
        </nav>

    </header>

    <section class="foerderung-section">

        <div class="foerderung-container">

            <h1>Förderungs-Check</h1>
            <p class="subtitle">Finden Sie heraus, welche Fördermittel für Ihr Bauvorhaben infrage kommen.</p>

            <form id="foerderForm">

                <div class="form-group">
                    <label for="bauvorhaben">Was möchten Sie umsetzen?</label>
                    <select id="bauvorhaben" required>
                        <option value="">-- Bitte wählen --</option>
                        <option value="dach">Dachdämmung</option>
                        <option value="heizung">Heizungstausch</option>
                        <option value="fenster">Fenster austauschen</option>
                        <option value="gebaeudehuelle">Gebäudehülle dämmen</option>
                        <option value="neubau">Energieeffizienter Neubau</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="gebaeudetyp">Gebäudetyp</label>
                    <select id="gebaeudetyp" required>
                        <option value="">-- Bitte wählen --</option>
                        <option value="einfamilienhaus">Einfamilienhaus</option>
                        <option value="mehrfamilienhaus">Mehrfamilienhaus</option>
                        <option value="gewerbe">Gewerbe / Büro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="baujahr">Baujahr des Gebäudes</label>
                    <input type="number" id="baujahr" placeholder="z.B. 1990" min="1900" max="2026" required>
                </div>

                <button type="submit" class="btn-primary">Förderung prüfen</button>

            </form>

            <div id="ergebnis" class="ergebnis-box" style="display: none;">
                <h2>Ihre möglichen Fördermittel</h2>
                <div id="ergebnisInhalt"></div>
                <button class="btn-secondary" id="zurueckBtn">Zurück zum Formular</button>
            </div>

        </div>

    </section>

    <footer>
        <a href="impressum.html">Impressum</a>
        <a href="datenschutz.html">Datenschutz</a>
    </footer>

    <script src="script.js"></script>
    <script src="foerderung-api.js"></script>
</body>

</html>
